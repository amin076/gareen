name: Gareen harder frontier double-coprime test

on:
  push:
    branches: [phase18-recursive-proof-planner]
    paths:
      - "experiments/frontier_double_coprime.py"
      - ".github/workflows/frontier-double-coprime.yml"
      - "portfolio_proof_planner.py"
      - "lean_proof_planner.py"
      - "Gareen/RecursivePlanner.lean"
      - "Gareen/RecursivePlannerLegacy.lean"

jobs:
  frontier:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare one-shot retrieval baseline with Gareen portfolio
        run: python experiments/frontier_double_coprime.py

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gareen-frontier-double-coprime
          path: |
            .gareen/frontier-double-coprime*
            .gareen/planner_candidates/
          if-no-files-found: warn
          include-hidden-files: true
