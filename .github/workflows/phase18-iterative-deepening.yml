name: Phase 18.5 iterative-deepening probe

on:
  push:
    branches: [phase18-recursive-proof-planner]
    paths:
      - "Gareen/RecursivePlanner.lean"
      - "recursive_proof_planner.py"
      - "experiments/phase18_iterative_deepening_probe.py"
      - ".github/workflows/phase18-iterative-deepening.yml"

jobs:
  probe:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run iterative-deepening probe
        run: python experiments/phase18_iterative_deepening_probe.py

      - name: Upload iterative-deepening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gareen-phase18-iterative-deepening
          path: |
            .gareen/phase18-iterative-deepening*
            .gareen/planner_candidates/
          if-no-files-found: warn
          include-hidden-files: true
