name: Phase 19 hard Fermat composed benchmark

on:
  push:
    branches: [phase19-ecosystem-strategies]
    paths:
      - "ecosystem_strategy_planner.py"
      - "lean_proof_planner.py"
      - "experiments/phase19_fermat_hard.py"
      - ".github/workflows/phase19-fermat-hard.yml"

jobs:
  fermat-hard:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true

      - name: Build lean-auto dependency
        run: lake build Auto

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hard Fermat benchmark
        run: python experiments/phase19_fermat_hard.py

      - name: Upload Fermat benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gareen-phase19-fermat-hard
          path: |
            .gareen/phase19-fermat-hard*
            .gareen/ecosystem_candidates/
            .gareen/feedback_candidates/
            .gareen/planner_candidates/
          if-no-files-found: warn
          include-hidden-files: true
