name: Phase 19 lean-auto validation

on:
  push:
    branches: [phase19-ecosystem-strategies]
    paths:
      - "lakefile.toml"
      - "lake-manifest.json"
      - "ecosystem_strategy_planner.py"
      - "experiments/phase19_lean_auto_validation.py"
      - ".github/workflows/phase19-lean-auto-validation.yml"

jobs:
  lean-auto-validation:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true

      - name: Build lean-auto dependency
        run: lake build Auto

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run lean-auto validation
        run: python experiments/phase19_lean_auto_validation.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gareen-phase19-lean-auto-validation
          path: |
            .gareen/phase19-lean-auto-validation*
            .gareen/ecosystem_candidates/
            .gareen/planner_candidates/
          if-no-files-found: warn
          include-hidden-files: true
