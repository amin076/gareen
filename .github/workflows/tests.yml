name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Gareen demo
        run: python math_world.py

      - name: Run automatic proof search demo
        run: python proof_search.py

      - name: Run autonomous theorem discovery demo
        run: python autonomous_discovery.py

      - name: Run general conjecture discovery demo
        run: python general_conjecture.py

      - name: Run Artificial Mathematician demo
        run: python artificial_mathematician.py

      - name: Audit mathematical research-value filter
        run: python experiments/research_value_audit.py

  lean-verification:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and audit Lean project
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true

      - name: Test recursive backtracking in Lean
        run: lake env lean tests/RecursivePlanner.lean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python to Lean bridge demo
        run: python lean_bridge.py --ci-demo

      - name: Run Lean-backed research demo
        run: python lean_research.py --limit 6 --json-out .gareen/lean-research-ci.json

      - name: Run number theory frontier smoke test
        run: python number_theory_frontier.py

      - name: Retest failed GCD target with theorem retrieval
        run: |
          python experiments/gcd_proof_trial_v2.py \
            --seconds 300 \
            --json-out .gareen/gcd-proof-retake.json \
            --markdown-out .gareen/gcd-proof-retake.md

      - name: Upload GCD retake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gareen-gcd-proof-retake
          path: |
            .gareen/gcd-proof-retake.json
            .gareen/gcd-proof-retake.md
          if-no-files-found: warn
          include-hidden-files: true

      - name: Phase 18 recursive planner fixed benchmark
        run: python experiments/recursive_benchmark.py --seconds 1600 --per-goal 25 --baseline-limit 10

      - name: Upload recursive planner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gareen-phase18-evidence
          path: |
            .gareen/phase18-benchmark*
            .gareen/planner_candidates/
          if-no-files-found: warn
          include-hidden-files: true
