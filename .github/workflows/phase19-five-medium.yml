name: Phase 19 ecosystem five-medium diagnostic

on:
  push:
    branches: [phase19-ecosystem-strategies]
    paths:
      - "ecosystem_strategy_planner.py"
      - "experiments/phase19_five_medium.py"
      - ".github/workflows/phase19-five-medium.yml"

jobs:
  five-medium:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ecosystem-only five-medium diagnostic
        run: python experiments/phase19_five_medium.py

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gareen-phase19-five-medium
          path: |
            .gareen/phase19-five-medium*
            .gareen/ecosystem_candidates/
          if-no-files-found: warn
          include-hidden-files: true
